services:
  db:
    image: postgres:16-alpine
    container_name: flowbit-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: flowbit
      POSTGRES_USER: flowbit
      POSTGRES_PASSWORD: flowbit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowbit -d flowbit"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: flowbit-backend
    container_name: flowbit-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://flowbit:flowbit@db:5432/flowbit?sslmode=disable
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: flowbit-frontend
    container_name: flowbit-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8080/api
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
